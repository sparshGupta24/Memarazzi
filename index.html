
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meme Mirror AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @keyframes scan-line {
      0% { top: 10%; opacity: 0; }
      50% { opacity: 0.8; }
      100% { top: 90%; opacity: 0; }
    }
    .animate-scan-line {
      animation: scan-line 4s ease-in-out infinite;
    }
    @keyframes progress-shrink {
      from { transform: scaleX(1); }
      to { transform: scaleX(0); }
    }
    .animate-progress-shrink {
      animation: progress-shrink 10s linear forwards;
    }
    @keyframes paparazzi-flash {
      0%, 100% { opacity: 0.2; transform: scale(1); filter: brightness(1); }
      5% { opacity: 1; transform: scale(1.1); filter: brightness(3); }
      10% { opacity: 0.2; transform: scale(1); filter: brightness(1); }
    }
    @keyframes paparazzi-pulse {
      0%, 100% { transform: scale(1); opacity: 0.5; }
      50% { transform: scale(0.95); opacity: 0.3; }
    }
    @keyframes spin-slow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes glow-pulse-blue {
      0%, 100% { box-shadow: 0 0 20px rgba(37, 99, 235, 0.2), 0 0 40px rgba(37, 99, 235, 0.1); }
      50% { box-shadow: 0 0 40px rgba(37, 99, 235, 0.6), 0 0 80px rgba(37, 99, 235, 0.3); }
    }
    @keyframes glow-pulse-amber {
      0%, 100% { box-shadow: 0 0 15px rgba(245, 158, 11, 0.1); }
      50% { box-shadow: 0 0 30px rgba(245, 158, 11, 0.4); }
    }
    .animate-paparazzi-active {
      animation: paparazzi-flash 3s infinite;
    }
    .animate-paparazzi-paused {
      animation: paparazzi-pulse 2s infinite;
    }
    .animate-glow-blue {
      animation: glow-pulse-blue 3s infinite ease-in-out;
    }
    .animate-glow-amber {
      animation: glow-pulse-amber 4s infinite ease-in-out;
    }
    .animate-spin-slow {
      animation: spin-slow 12s linear infinite;
    }
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #4b5563;
      border-radius: 10px;
    }
  </style>
<script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.39.0",
    "peerjs": "https://esm.sh/peerjs@1.5.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4"
  }
}
</script>
</head>
<body class="bg-black text-gray-100 overflow-hidden h-screen w-screen">
  <div id="root"></div>
</body>
</html>
